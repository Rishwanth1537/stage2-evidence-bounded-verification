[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "mcp-hallucination-checker"
version = "0.1.0"
description = "Self-reflective hallucination verification MCP server using SRL + GED"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "spacy>=3.7.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "networkx>=3.2",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
]
benchmark = [
    "datasets>=2.18.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that require downloaded ML models (deselect with '-m not integration')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name (l, O, I)
]
